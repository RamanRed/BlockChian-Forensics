[project]
name = "forensic-evidence-tests"
version = "1.0.0"
description = "Test suite for Digital Forensic Evidence Preservation System with Hugging Face Vision Transformer"
requires-python = ">=3.9"
dependencies = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=4.1.1",
    "torch>=2.3.0",
    "transformers>=4.38.2",
    "pillow>=10.3.0",
    "numpy>=1.26.4",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short --strict-markers"
markers = [
    "asyncio: marks tests as async (slow)",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
